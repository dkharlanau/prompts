library_version: 1.0.0
canonical_prompt: deep-run
benchmark: DRS-100
profile_version: 1.0.0
model_profiles_last_verified: 2026-09-09

prompts:
  - id: deep-run
    path: loops/deep-run.md
    version: 1.0.0
    status: candidate
    use_when: substantial project, product, service, website, software, research or strategy work that benefits from a complete inspect-decide-execute-verify loop
    avoid_when: small deterministic edit, simple factual answer, or consequential irreversible action outside granted authority
    patterns:
      - reality-inspection
      - baseline-evaluation
      - independent-perspectives
      - dominant-bottleneck
      - best-of-n
      - adversarial-review
      - pre-mortem
      - experiment-gate
      - execution
      - evaluator-optimizer
      - regression-and-entropy-check
      - reflection
    benchmark_target: DRS-100 >= 85 across at least 3 domains

model_profiles:
  preferred_flagship:
    model: GPT-6 Astra
    reasoning: Medium
    escalate_to: High
    use_when: hardest end-to-end multi-step work across research, code, tools and verification
  default_workhorse:
    model: GPT-5.6 Sol
    reasoning: High
    escalate_to: Extra High
    use_when: normal full Deep Run
  bounded_subwork:
    model: GPT-5.6 Luna
    reasoning: Think
    use_when: focused or repetitive sub-work; not preferred as sole final judge when stronger models are available

unresolved_aliases:
  Solana:
    status: unverified
    note: No current official OpenAI model with this name was found as of 2026-09-09. Do not silently map it; verify exact current model label first.

selection_policy:
  - use deep-run for consequential multi-step work
  - fill project context from real sources of truth before asking the user
  - choose model and reasoning from MODEL_PROFILES.md
  - execute through verification when authorized
  - use model-specific adapters as overlays, not cloned prompt variants
  - update model recommendations only after comparable benchmark runs

refresh_triggers:
  - new model release
  - model rename or retirement
  - material model behavior update
  - reasoning-control change
  - new official prompting guidance
  - benchmark evidence contradicts current recommendation
